name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Use the Chrome that GitHub's runners already have. Installing a browser with apt is usually 20 seconds
      # but sometimes takes 10 minutes when the package mirror is slow. Fall back to the install only if Chrome is missing.
      - name: Browser for the tests
        timeout-minutes: 5
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "PW_CHROMIUM=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else
            python3 -m playwright install --with-deps chromium
          fi
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      # Pull requests are strict: any problem fails the check.
      # On main, a broken article is skipped (with a warning) so the rest of the site still deploys.
      # Data and graph errors (cycles, unknown prerequisites, ...) always fail.
      - name: Build site
        run: python3 scripts/build.py ${{ github.ref == 'refs/heads/main' && '--lenient' || '' }}
      - name: Browser smoke test
        run: python3 tests/smoke.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    timeout-minutes: 10
    # Opens the live site in a browser right after deploying. A red run here means prod is broken.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # Use the Chrome that GitHub's runners already have. Installing a browser with apt is usually 20 seconds
      # but sometimes takes 10 minutes when the package mirror is slow. Fall back to the install only if Chrome is missing.
      - name: Browser for the tests
        timeout-minutes: 5
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "PW_CHROMIUM=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else
            python3 -m playwright install --with-deps chromium
          fi
      - run: python3 tests/smoke.py "${{ needs.deploy.outputs.page_url }}"
