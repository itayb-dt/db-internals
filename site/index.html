<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Database Internals Map</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0d1a;color:#e8eaf6;font-family:-apple-system,system-ui,Segoe UI,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;cursor:grab}
canvas:active{cursor:grabbing}
.box{position:fixed;background:rgba(15,19,36,.88);border:1px solid rgba(255,255,255,.1);border-radius:10px;font-size:12px}
h4{margin:0 0 6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8890b5;font-weight:600}
.title{position:fixed;left:24px;top:20px;font-size:28px;font-weight:700;letter-spacing:-.01em}
.title small{display:block;font-size:13px;font-weight:400;color:#8890b5;margin-top:4px}
.legend{left:16px;bottom:16px;padding:10px 12px}
.leg{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;user-select:none}
.leg.off{opacity:.35}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.panel{right:16px;top:16px;width:290px;transition:width .15s;max-height:calc(100% - 32px);overflow:auto;padding:14px;display:none}
.panel.wide{width:min(680px,calc(100vw - 32px))}
.ring{width:11px;height:11px;border-radius:50%;display:inline-block;border:1.5px solid #e8eaf6;margin-right:8px;box-sizing:border-box}
.details{color:#aeb4d6;line-height:1.45;margin-bottom:12px}
.details p{margin:0 0 8px}
#art{margin-top:6px;border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
#art .state{color:#8890b5}#art .state a{color:#9db2ff;cursor:pointer;text-decoration:underline}
.article{color:#c9cde8;line-height:1.6;font-size:14px;overflow-wrap:anywhere}
.article h1{font-size:22px;margin:0 0 10px;color:#fff}
.article h2{font-size:17px;margin:22px 0 8px;color:#fff;border-top:1px solid rgba(255,255,255,.08);padding-top:14px}
.article h3{font-size:14px;margin:16px 0 6px;color:#fff}
.article p{margin:0 0 10px;color:inherit}
.article a{color:#9db2ff}
.article img,.article iframe{max-width:100%;border-radius:6px}
.article iframe{width:100%;aspect-ratio:16/9;height:auto;border:0}
.article code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:rgba(255,255,255,.07);padding:1px 4px;border-radius:4px}
.article pre{background:#070a14;border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:10px 12px;overflow:auto;margin:0 0 12px}
.article pre code{background:none;padding:0;font-size:12px;line-height:1.5;color:#dfe3ff}
.article table{border-collapse:collapse;width:100%;margin:0 0 12px;font-size:12.5px;display:block;overflow-x:auto}
.article th,.article td{border:1px solid rgba(255,255,255,.14);padding:5px 8px;text-align:left;vertical-align:top}
.article th{background:rgba(255,255,255,.06);color:#fff}
.article blockquote{margin:0 0 10px;padding-left:12px;border-left:3px solid #3a4270;color:#aeb4d6}
.article ul,.article ol{margin:0 0 10px;padding-left:20px;list-style:revert}
.article li{padding:2px 0}
.article-meta{font-size:12px;color:#8890b5}
.article-sources ul{padding-left:18px}.article-sources li{font-size:12.5px}
.meta{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8890b5}
.panel h3{margin:4px 0 6px;font-size:18px}
.panel p{margin:0 0 12px;color:#aeb4d6;line-height:1.45}
.big{font-size:34px;font-weight:700;line-height:1}
.big small{font-size:12px;font-weight:400;color:#8890b5;margin-left:6px}
ul{list-style:none;margin:0 0 12px;padding:0}
li{padding:3px 0}
li.link{cursor:pointer}li.link:hover{color:#fff;text-decoration:underline}
li.ev{color:#aeb4d6;padding-left:12px;text-indent:-12px}li.ev:before{content:"\2022  "}
.x{position:absolute;right:12px;top:8px;cursor:pointer;color:#8890b5;font-size:18px}
.hint{right:16px;bottom:16px;padding:6px 10px;color:#8890b5}
.err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:#ff9e7a;padding:30px}
</style></head><body>
<canvas id="c"></canvas>
<div class="title">Database Internals<small id="sub"></small></div>
<div class="box legend" id="legend"><h4>Subjects &middot; click to toggle</h4></div>
<div class="box panel" id="panel"><span class="x" id="x">&times;</span>
<div class="meta" id="pm"></div><h3 id="pt"></h3><p id="pd"></p><div class="details" id="pdt" style="display:none"></div>
<div class="big"><span id="pn">0</span><small>prerequisites in total</small></div><div style="height:12px"></div>
<h4>Builds directly on</h4><ul id="pb"></ul><h4>Unlocks next</h4><ul id="pu"></ul><h4>You understand it when you can</h4><ul id="pe"></ul>
<div id="art" style="display:none"><h4>Read the full article</h4><div id="artbody"></div></div></div>
<div class="box hint"><b>Drag</b> to spin &middot; <b>Scroll</b> to zoom &middot; <b>Click</b> a dot</div>
<div class="err" id="err"></div>
<script>
fetch('graph.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(init)
 .catch(e=>{const d=document.getElementById('err');d.style.display='flex';
  d.innerHTML='Could not load graph.json ('+e.message+').<br>Open the built site over HTTP, e.g. <code>python3 scripts/build.py --serve</code>'});

function init(G){
const SUBJ=Object.fromEntries(G.subjects.map(s=>[s.name,s.color]));
const nodes=G.topics.map(t=>({...t,x:(Math.random()-.5)*200,y:180-t.level*100,z:(Math.random()-.5)*200,vx:0,vy:0,vz:0}));
const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
const links=G.edges.map(e=>({s:byId[e.prerequisite],t:byId[e.topic],soft:e.strength==='soft',reason:e.reason,p:Math.random()}));
const pre={},nxt={};nodes.forEach(n=>{pre[n.id]=[];nxt[n.id]=[]});
links.forEach(l=>{pre[l.t.id].push(l);nxt[l.s.id].push(l)});
document.getElementById('sub').textContent=nodes.length+' concepts and '+links.length+' prerequisite links';
function ancestors(n){const seen=new Set(),st=[n];while(st.length){const c=st.pop();pre[c.id].forEach(l=>{if(!seen.has(l.s.id)){seen.add(l.s.id);st.push(l.s)}})}return seen}
const names=G.subjects.map(s=>s.name),cluster={};
names.forEach((k,i)=>{const a=i/names.length*Math.PI*2;cluster[k]=[Math.cos(a)*150,Math.sin(a)*150]});
const off=new Set();let sel=null,anc=new Set(),alpha=1;
function step(){
 for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
  const a=nodes[i],b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y,dz=a.z-b.z;const d2=dx*dx+dy*dy+dz*dz+1;
  const f=9000/d2*alpha,d=Math.sqrt(d2);dx/=d;dy/=d;dz/=d;
  a.vx+=dx*f;a.vy+=dy*f;a.vz+=dz*f;b.vx-=dx*f;b.vy-=dy*f;b.vz-=dz*f}
 links.forEach(l=>{const a=l.s,b=l.t;let dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z;const d=Math.sqrt(dx*dx+dy*dy+dz*dz)+.01;
  const f=(d-110)*.018*alpha;dx/=d;dy/=d;dz/=d;a.vx+=dx*f;a.vy+=dy*f;a.vz+=dz*f;b.vx-=dx*f;b.vy-=dy*f;b.vz-=dz*f});
 nodes.forEach(n=>{const c=cluster[n.subject];n.vx+=(c[0]-n.x)*.015*alpha;n.vz+=(c[1]-n.z)*.015*alpha;
  n.vy+=(180-n.level*100-n.y)*.08;n.vx*=.85;n.vy*=.85;n.vz*=.85;n.x+=n.vx;n.y+=n.vy;n.z+=n.vz});
 alpha=Math.max(.05,alpha*.985)}
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr=1,yaw=.6,pitch=.25,zoom=1.5,auto=true,drag=null;
function resize(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr}
addEventListener('resize',resize);resize();
function proj(n){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
 let x=n.x*cy-n.z*sy,z=n.x*sy+n.z*cy,y=n.y*cp-z*sp;z=n.y*sp+z*cp;
 const f=520/(520+z+300),s=f*zoom*Math.min(W,H)/520;return{x:W/2+x*s,y:H/2+y*s,s,z}}
const vis=n=>!off.has(n.subject);
function draw(t){
 step();if(auto&&!drag)yaw+=.0025;
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#0a0d1a';ctx.fillRect(0,0,W,H);
 nodes.forEach(n=>n.p=proj(n));
 links.forEach(l=>{if(!vis(l.s)||!vis(l.t))return;const a=l.s.p,b=l.t.p;
  const on=sel&&((anc.has(l.s.id)||l.s===sel)&&(anc.has(l.t.id)||l.t===sel));
  ctx.strokeStyle=on?'rgba(255,214,200,.85)':sel?'rgba(120,130,190,.08)':'rgba(130,145,210,.28)';
  ctx.lineWidth=on?1.6:1;ctx.setLineDash(l.soft?[4,4]:[]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);
  const k=(l.p+t*.00018)%1;ctx.fillStyle=on?'#fff':sel?'rgba(255,255,255,.1)':'rgba(255,255,255,.7)';
  ctx.beginPath();ctx.arc(a.x+(b.x-a.x)*k,a.y+(b.y-a.y)*k,on?2.4:1.6,0,7);ctx.fill()});
 nodes.filter(vis).sort((a,b)=>b.p.z-a.p.z).forEach(n=>{const p=n.p,c=SUBJ[n.subject];const on=!sel||n===sel||anc.has(n.id);
  const r=(6+Math.min(10,nxt[n.id].length*1.8))*p.s*1.1;ctx.globalAlpha=on?1:.18;
  const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*3);g.addColorStop(0,c+'66');g.addColorStop(1,c+'00');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r*3,0,7);ctx.fill();
  ctx.fillStyle=n===sel?'#fff':c;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();
  if(n===sel){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}
  if(n.has_content){ctx.strokeStyle='#e8eaf6';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,r+4*p.s+2,0,7);ctx.stroke()}
  ctx.fillStyle='#d8dcf5';ctx.font=`${Math.max(10,12*p.s)}px -apple-system,sans-serif`;ctx.textAlign='center';
  ctx.fillText(n.name,p.x,p.y+r+13*Math.max(.8,p.s));ctx.globalAlpha=1});
 requestAnimationFrame(draw)}
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:false};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;yaw+=dx*.008;pitch=Math.max(-1.4,Math.min(1.4,pitch+dy*.006));drag.x=e.clientX;drag.y=e.clientY});
cv.addEventListener('pointerup',e=>{const m=drag&&drag.moved;drag=null;if(m)return;
 const mx=e.clientX,my=e.clientY;let best=null,bd=28;
 nodes.filter(vis).forEach(n=>{const d=Math.hypot(n.p.x-mx,n.p.y-my);if(d<bd){bd=d;best=n}});select(best)});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.4,Math.min(3,zoom*(e.deltaY<0?1.1:.9)))},{passive:false});
const P=id=>document.getElementById(id);
function fill(el,items,cls,fn){const u=P(el);u.innerHTML='';
 if(!items.length){u.innerHTML='<li style="opacity:.5">none</li>';return}items.forEach(i=>u.appendChild(fn(i)))}
const artCache={};let artTok=0;
function showArticle(n){const box=P('art'),body=P('artbody'),tok=++artTok;
 box.style.display=n.has_content?'block':'none';body.innerHTML='';if(!n.has_content)return;
 if(artCache[n.id]!==undefined){body.innerHTML=artCache[n.id];return}
 const state=(msg,retry)=>{body.innerHTML='';const d=document.createElement('div');d.className='state';d.textContent=msg;
  if(retry){d.appendChild(document.createTextNode(' '));const a=document.createElement('a');a.textContent='Retry';a.onclick=()=>showArticle(n);d.appendChild(a)}body.appendChild(d)};
 state('Loading article\u2026');
 fetch('content/'+encodeURIComponent(n.id)+'.html').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
  .then(h=>{artCache[n.id]=h;if(tok===artTok)body.innerHTML=h})
  .catch(e=>{if(tok===artTok)state('Could not load the article ('+e.message+').',true)})}
function select(n){sel=n;if(!n){anc=new Set();artTok++;P('panel').style.display='none';auto=true;return}
 auto=false;anc=ancestors(n);P('panel').style.display='block';
 P('pm').textContent=n.subject+' · '+n.domain+' · '+G.levels[n.level];
 P('pt').textContent=n.name;P('pd').textContent=n.description;P('pn').textContent=anc.size;
 const dt=P('pdt');dt.style.display=n.details_html?'block':'none';dt.innerHTML=n.details_html||'';
 P('panel').classList.toggle('wide',!!n.has_content);showArticle(n);
 const nodeLi=(m,reason)=>{const li=document.createElement('li');li.className='link';li.title=reason||'';
  li.innerHTML='<span class="dot" style="background:'+SUBJ[m.subject]+';margin-right:8px"></span>'+m.name;li.onclick=()=>select(m);return li};
 fill('pb',pre[n.id],'',l=>nodeLi(l.s,l.reason));fill('pu',nxt[n.id],'',l=>nodeLi(l.t,l.reason));
 fill('pe',n.evidence,'',t=>{const li=document.createElement('li');li.className='ev';li.textContent=t;return li})}
P('x').onclick=()=>select(null);
names.forEach(k=>{const d=document.createElement('div');d.className='leg';
 d.innerHTML='<span class="dot" style="background:'+SUBJ[k]+'"></span>'+k+' <span style="margin-left:auto;opacity:.6;padding-left:14px">'+nodes.filter(n=>n.subject===k).length+'</span>';
 d.onclick=()=>{off.has(k)?off.delete(k):off.add(k);d.classList.toggle('off');if(sel&&!vis(sel))select(null)};P('legend').appendChild(d)});
{const d=document.createElement('div');d.style.cssText='margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.1);color:#aeb4d6';
 d.innerHTML='<span class="ring"></span>Ring = has a full article';P('legend').appendChild(d)}
for(let i=0;i<250;i++)step();
requestAnimationFrame(draw);
}
</script></body></html>
