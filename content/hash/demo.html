<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hash index demo</title>
<style>
html,body{margin:0;height:100%;background:#0f1324;overflow:hidden}
svg{width:100%;height:100%;display:block}
text{font-family:-apple-system,system-ui,Segoe UI,Helvetica,Arial,sans-serif}
</style></head><body>
<svg id="s" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A hash index sends a value through a hash function to one bucket page. An equality lookup reads one bucket. A range cannot work, because neighbouring values land in unrelated buckets.">
 <title>Hash index demo</title>
</svg>
<script>
(function(){
var NS='http://www.w3.org/2000/svg',LOOP=10,svg=document.getElementById('s');
function clamp(x){return Math.max(0,Math.min(1,x))}
function mk(tag,a,s){var e=document.createElementNS(NS,tag);for(var k in a)e.setAttribute(k,a[k]);if(s!=null)e.textContent=s;svg.appendChild(e);return e}
function box(x,y,w,h,o){o=o||{};var e=mk('rect',{x:x,y:y,width:w,height:h,rx:o.rx==null?6:o.rx,fill:o.fill||'#1b2140',stroke:o.stroke||'#2a3158','stroke-width':o.sw||1.5});e._f=o.fill||'#1b2140';e._s=o.stroke||'#2a3158';return e}
function txt(x,y,s,o){o=o||{};var e=mk('text',{x:x,y:y,'text-anchor':o.a||'middle','font-size':o.size||13,'font-weight':o.b?700:400,fill:o.fill||'#e8eaf6'},s);e._c=o.fill||'#e8eaf6';return e}
function line(x1,y1,x2,y2,o){o=o||{};var e=mk('path',{d:'M'+x1+' '+y1+'L'+x2+' '+y2,stroke:o.stroke||'#2a3158','stroke-width':o.sw||2,fill:'none'});e._s=o.stroke||'#2a3158';return e}
function on(e,f,fill,stroke,w){e.setAttribute('fill',f?fill:e._f);e.setAttribute('stroke',f?stroke:e._s);e.setAttribute('stroke-width',f?(w||3):1.5)}
function lon(e,f,stroke,w){e.setAttribute('stroke',f?stroke:e._s);e.setAttribute('stroke-width',f?(w||3):2)}
function tc(e,f,c){e.setAttribute('fill',f?c:e._c)}
function dot(e,pts,t0,t1,t){if(t<t0||t>t1){e.setAttribute('opacity',0);return}var u=clamp((t-t0)/(t1-t0))*(pts.length-1),i=Math.min(Math.floor(u),pts.length-2),f=u-i;e.setAttribute('cx',pts[i][0]+(pts[i+1][0]-pts[i][0])*f);e.setAttribute('cy',pts[i][1]+(pts[i+1][1]-pts[i][1])*f);e.setAttribute('opacity',1)}
var GREEN='#7ee0a1',YEL='#ffd166',VIO='#c78bff',CY='#4dd0e1',MUTE='#8890b5';
box(20,14,760,30,{rx:8,fill:'#161b33',stroke:'#2a3158'});
var crumb=txt(36,34,'',{a:'start',b:1,size:14});
var cap=txt(400,430,'',{b:1,size:16});
var bar=mk('rect',{x:0,y:446,width:0,height:4,fill:VIO});
var STILL=5;
var STILL=3.0;

crumb.textContent='';
txt(400,70,'illustration: the bucket numbers are made up',{size:11,fill:MUTE});
var q=box(30,150,150,50,{stroke:'#5b7cff'}),qt=txt(105,181,'',{b:1,size:13});
var hf=box(250,150,120,50,{stroke:VIO}),ht=txt(310,181,'hash function',{b:1,size:13,fill:VIO});
var bk=[],bt=[];
for(var i=0;i<8;i++){var y=84+i*40;bk.push(box(520,y,240,32,{stroke:'#2a3158'}));txt(556,y+21,'bucket '+i,{size:12,fill:MUTE});
 for(var c=0;c<3;c++)box(640+c*36,y+6,30,20,{rx:3,fill:'#14182e'})}
line(180,175,250,175);line(370,175,520,175,{stroke:'#2a3158'});
var d=[mk('circle',{r:8,fill:YEL}),mk('circle',{r:8,fill:CY}),mk('circle',{r:8,fill:'#ff9e7a'})];
var msg=txt(310,226,'',{size:13,b:1,fill:YEL});
function bc(i){return 520}
function by(i){return 84+i*40+16}
function render(t){
 var A=t<4.8;
 for(var i=0;i<8;i++)on(bk[i],false);msg.textContent='';d.forEach(function(e){e.setAttribute('opacity',0)});
 on(q,false);on(hf,false);
 if(A){
  crumb.textContent='WHERE token = \'abc\'';qt.textContent='token = abc';
  on(q,t<0.5,'#1b2140',YEL,3);
  dot(d[0],[[180,175],[250,175]],0.5,1.3,t);
  if(t>=1.3&&t<2.1)on(hf,true,'#1b2140',YEL,3);
  if(t>=1.3)msg.textContent='hash(abc) = bucket 5';
  dot(d[0],[[370,175],[460,175],[520,by(5)]],2.1,2.9,t);
  if(t>=2.9)on(bk[5],true,'#1f4a38',GREEN,4);
  cap.textContent=t<1.3?'A hash index turns the value into a number.':t<2.1?'The same value always gives the same bucket.':t<2.9?'Go straight to that bucket page. No tree to walk.':'One bucket page to read, then the table row.';
 }else{
  crumb.textContent='WHERE token > \'m\'    (a range)';qt.textContent='token > m';
  var v=['a','b','c'],bs=[2,6,0],t0=5.2;
  for(var k=0;k<3;k++){var s=t0+k*1.0;dot(d[k],[[180,175],[250,175],[370,175],[460,175],[520,by(bs[k])]],s,s+1.0,t);
   if(t>=s+1.0){on(bk[bs[k]],true,'#3a3358',[YEL,CY,'#ff9e7a'][k],3)}}
  if(t>=5.2)msg.textContent='hash(a), hash(b), hash(c) ...';
  if(t>=8.4)msg.textContent='neighbours, different buckets';
  cap.textContent=t<8.4?'Neighbouring values are sent to unrelated buckets...':'...so there is no order to follow: hash indexes only do =.';
 }
}

var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(t){render(t);bar.setAttribute('width',800*t/LOOP)}
if(reduce){draw(STILL);return}
var t0=performance.now();
(function frame(now){draw(Math.max(0,(now-t0)/1000)%LOOP);requestAnimationFrame(frame)})(t0);
})();
</script></body></html>
