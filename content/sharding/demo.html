<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sharding demo</title>
<style>
html,body{margin:0;height:100%;background:#0f1324;overflow:hidden}
svg{width:100%;height:100%;display:block}
text{font-family:-apple-system,system-ui,Segoe UI,Helvetica,Arial,sans-serif;fill:#e8eaf6}
.m{fill:#8890b5}.b{font-weight:700}
</style></head><body>
<svg id="s" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="An application sends two queries through a router to three shards. The first query contains the shard key, so the router sends it to one shard. The second query does not contain the shard key, so the router sends it to all three shards and merges the answers, and the slowest shard sets the time.">
 <title>A query with the shard key goes to one shard, a query without it goes to all shards</title>
 <rect x="20" y="14" width="760" height="30" rx="8" fill="#161b33" stroke="#2a3158"/>
 <text id="crumb" x="36" y="34" font-size="14" class="b"></text>
 <!-- links -->
 <g stroke="#2a3158" stroke-width="2" fill="none">
  <path d="M140 225H230"/><path d="M340 225H400V105H520"/><path d="M340 225H520"/><path d="M340 225H400V345H520"/>
 </g>
 <!-- app -->
 <rect x="30" y="170" width="110" height="110" rx="12" fill="#161b33" stroke="#5b7cff" stroke-width="2"/>
 <text x="85" y="220" text-anchor="middle" font-size="18" class="b">App</text>
 <text x="85" y="244" text-anchor="middle" font-size="12" class="m">one logical DB</text>
 <!-- router -->
 <rect id="rt" x="230" y="190" width="110" height="70" rx="12" fill="#161b33" stroke="#c78bff" stroke-width="2" data-c="#c78bff"/>
 <text x="285" y="222" text-anchor="middle" font-size="16" class="b" style="fill:#c78bff">Router</text>
 <text id="hash" x="285" y="244" text-anchor="middle" font-size="12" class="m"></text>
 <!-- shards -->
 <g id="sh1"><rect id="r1" x="520" y="60" width="240" height="90" rx="12" fill="#161b33" stroke="#7ee0a1" stroke-width="2" data-c="#7ee0a1"/>
  <text x="540" y="90" font-size="16" class="b">Shard 1</text><text x="540" y="114" font-size="12" class="m">customers 7, 19, 63 ...</text><text x="540" y="134" font-size="12" class="m">a normal PostgreSQL instance</text></g>
 <g id="sh2"><rect id="r2" x="520" y="180" width="240" height="90" rx="12" fill="#161b33" stroke="#7ee0a1" stroke-width="2" data-c="#7ee0a1"/>
  <text x="540" y="210" font-size="16" class="b">Shard 2</text><text x="540" y="234" font-size="12" class="m">customers 5, 42, 88 ...</text><text x="540" y="254" font-size="12" class="m">a normal PostgreSQL instance</text></g>
 <g id="sh3"><rect id="r3" x="520" y="300" width="240" height="90" rx="12" fill="#161b33" stroke="#7ee0a1" stroke-width="2" data-c="#7ee0a1"/>
  <text x="540" y="330" font-size="16" class="b">Shard 3</text><text x="540" y="354" font-size="12" class="m">customers 13, 27, 71 ...</text><text x="540" y="374" font-size="12" class="m">a normal PostgreSQL instance</text></g>
 <!-- dots -->
 <circle id="q0" r="9" fill="#ffd166"/>
 <circle id="q1" r="8" fill="#ffd166"/><circle id="q2" r="8" fill="#ffd166"/><circle id="q3" r="8" fill="#ffd166"/>
 <circle id="a1" r="8" fill="#4dd0e1"/><circle id="a2" r="8" fill="#4dd0e1"/><circle id="a3" r="8" fill="#4dd0e1"/><circle id="a0" r="9" fill="#4dd0e1"/>
 <text id="cap" x="400" y="426" text-anchor="middle" font-size="16" font-weight="600"></text>
 <rect id="bar" x="0" y="446" width="0" height="4" fill="#c78bff"/>
</svg>
<script>
(function(){
var LOOP=10,$=function(id){return document.getElementById(id)};
var clamp=function(x){return Math.max(0,Math.min(1,x))};
var A=[140,225],R=[285,225],S1=[520,105],S2=[520,225],S3=[520,345];
// move dot id along waypoints between t0 and t1, hidden outside that window
function dot(id,pts,t0,t1,t){
 var e=$(id);if(t<t0||t>t1){e.setAttribute('opacity',0);return}
 var u=clamp((t-t0)/(t1-t0))*(pts.length-1),i=Math.min(Math.floor(u),pts.length-2),f=u-i;
 e.setAttribute('cx',pts[i][0]+(pts[i+1][0]-pts[i][0])*f);e.setAttribute('cy',pts[i][1]+(pts[i+1][1]-pts[i][1])*f);e.setAttribute('opacity',1)}
function lit(id,on,color){var e=$(id);e.setAttribute('stroke-width',on?5:2);e.setAttribute('stroke',on?color:e.getAttribute('data-c'))}
function render(t){
 // the query dot: app to router, waits at the router, then goes on
 var Q=[[0.3,1.1,[A,R]],[1.1,1.7,[R,R]],[1.7,2.5,[R,[400,225],S2]],
        [4.0,4.7,[A,R]],[4.7,4.9,[R,R]]],seg=null;
 Q.forEach(function(x){if(t>=x[0]&&t<x[1])seg=x});
 if(seg)dot('q0',seg[2],seg[0],seg[1]+0.0001,t);else $('q0').setAttribute('opacity',0);
 dot('a0',[S2,[400,225],R,A],2.9,3.7,t);
 // query 2 fans out to every shard
 dot('q1',[R,[400,225],[400,105],S1],4.9,5.7,t);dot('q2',[R,S2],4.9,5.7,t);dot('q3',[R,[400,225],[400,345],S3],4.9,5.7,t);
 dot('a1',[S1,[400,105],[400,225],R],6.0,6.8,t);dot('a2',[S2,R],6.0,6.8,t);dot('a3',[S3,[400,345],[400,225],R],6.8,7.6,t);
 if(t>=7.7&&t<=8.4)dot('a0',[R,A],7.7,8.4,t);
 // shard highlights
 lit('r2',(t>=2.5&&t<2.9)||(t>=5.7&&t<6.0),'#e8fff0');
 lit('r1',t>=5.7&&t<6.0,'#e8fff0');lit('r3',t>=5.7&&t<6.8,'#e8fff0');
 lit('rt',(t>=1.1&&t<1.7)||(t>=4.7&&t<4.9)||(t>=7.5&&t<7.7),'#e6c8ff');
 var crumb,cap,hash='';
 if(t<4){crumb='Query 1:  WHERE customer_id = 42   (has the shard key)';
  cap=t<1.1?'The app sends the query to the router.':t<1.7?'The router hashes the key: customer 42 lives on shard 2.':t<2.9?'Only shard 2 does the work.':'One shard answered. The others never noticed.';
  if(t>=1.1)hash='hash(42) = shard 2'}
 else if(t<8.5){crumb='Query 2:  count all orders from today   (no shard key)';
  cap=t<4.9?'The router has no key to pick a shard.':t<6.0?'Every shard runs the query.':t<7.6?'The slowest shard sets the time. Shard 3 is slower here.':'The router merges the partial answers.';
  if(t>=7.6&&t<8.5)hash='merge'}
 else{crumb='Result';cap='Queries with the key scale out. Queries without it touch every shard.'}
 $('crumb').textContent=crumb;$('cap').textContent=cap;$('hash').textContent=hash;
 $('bar').setAttribute('width',800*t/LOOP)}
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce){render(5.3);return}
var t0=performance.now();
(function frame(now){render(Math.max(0,(now-t0)/1000)%LOOP);requestAnimationFrame(frame)})(t0);
})();
</script></body></html>
