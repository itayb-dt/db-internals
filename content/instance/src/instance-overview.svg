<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img"><title>The components of a PostgreSQL instance</title><desc>An instance contains processes, shared memory with the buffer pool, WAL and logs shared by all databases, several databases, and inside a database the tables with heap, indexes and TOAST, all stored as files in the data directory and tablespaces.</desc><rect width="1000" height="660" fill="#0f1324"/><rect x="10" y="10" width="980" height="640" rx="16" fill="#0f1324" stroke="#4dd0e1" stroke-width="3"/><text x="30" y="44" font-size="22" fill="#4dd0e1" text-anchor="start" font-weight="700" font-family="Helvetica, Arial, sans-serif">PostgreSQL instance: one server, one data directory</text><rect x="30" y="62" width="940" height="80" rx="10" fill="#161b33" stroke="#4dd0e1" stroke-width="2"/><text x="44" y="84" font-size="15" fill="#8890b5" text-anchor="start" font-weight="400" font-family="Helvetica, Arial, sans-serif">Processes</text><rect x="44" y="92" width="280" height="40" rx="8" fill="#1b2140" stroke="#4dd0e1" stroke-width="2"/><text x="184.0" y="118.0" font-size="17" fill="#e8eaf6" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">postmaster (supervisor)</text><rect x="334" y="92" width="270" height="40" rx="8" fill="#1b2140" stroke="#4dd0e1" stroke-width="2"/><text x="469.0" y="118.0" font-size="17" fill="#e8eaf6" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">one backend per connection</text><rect x="614" y="92" width="340" height="40" rx="8" fill="#1b2140" stroke="#4dd0e1" stroke-width="2"/><text x="784.0" y="118.0" font-size="17" fill="#e8eaf6" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">background workers</text><rect x="30" y="152" width="940" height="80" rx="10" fill="#161b33" stroke="#4dd0e1" stroke-width="2"/><text x="44" y="174" font-size="15" fill="#8890b5" text-anchor="start" font-weight="400" font-family="Helvetica, Arial, sans-serif">Shared memory</text><rect x="44" y="182" width="520" height="40" rx="8" fill="#1b2140" stroke="#7ee0a1" stroke-width="2"/><text x="304.0" y="208.0" font-size="17" fill="#e8eaf6" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">Buffer pool (shared buffers): cached pages</text><rect x="574" y="182" width="380" height="40" rx="8" fill="#1b2140" stroke="#7ee0a1" stroke-width="2"/><text x="764.0" y="208.0" font-size="17" fill="#e8eaf6" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">WAL buffers</text><rect x="30" y="242" width="940" height="80" rx="10" fill="#161b33" stroke="#4dd0e1" stroke-width="2"/><text x="44" y="264" font-size="15" fill="#8890b5" text-anchor="start" font-weight="400" font-family="Helvetica, Arial, sans-serif">Shared by every database</text><rect x="44" y="272" width="215" height="40" rx="8" fill="#1b2140" stroke="#ffd166" stroke-width="2"/><text x="151.5" y="298.0" font-size="17" fill="#e8eaf6" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">WAL (pg_wal)</text><rect x="269" y="272" width="215" height="40" rx="8" fill="#1b2140" stroke="#ffd166" stroke-width="2"/><text x="376.5" y="298.0" font-size="17" fill="#e8eaf6" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">Server logs</text><rect x="494" y="272" width="235" height="40" rx="8" fill="#1b2140" stroke="#ffd166" stroke-width="2"/><text x="611.5" y="298.0" font-size="17" fill="#e8eaf6" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">Roles, tablespaces</text><rect x="739" y="272" width="215" height="40" rx="8" fill="#1b2140" stroke="#ffd166" stroke-width="2"/><text x="846.5" y="298.0" font-size="17" fill="#e8eaf6" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">Config files</text><rect x="30" y="332" width="940" height="238" rx="10" fill="#161b33" stroke="#c78bff" stroke-width="2"/><text x="44" y="354" font-size="15" fill="#8890b5" text-anchor="start" font-weight="400" font-family="Helvetica, Arial, sans-serif">Databases: separate data inside one instance, a connection uses one</text><rect x="44" y="366" width="520" height="192" rx="10" fill="#1b2140" stroke="#c78bff" stroke-width="3"/><text x="60" y="390" font-size="19" fill="#c78bff" text-anchor="start" font-weight="700" font-family="Helvetica, Arial, sans-serif">app</text><text x="110" y="390" font-size="15" fill="#8890b5" text-anchor="start" font-weight="400" font-family="Helvetica, Arial, sans-serif">schemas, then tables</text><rect x="60" y="402" width="488" height="146" rx="8" fill="#161b33" stroke="#5b7cff" stroke-width="2"/><text x="76" y="424" font-size="16" fill="#e8eaf6" text-anchor="start" font-weight="700" font-family="Helvetica, Arial, sans-serif">table: orders</text><rect x="76" y="436" width="140" height="100" rx="8" fill="#1b2140" stroke="#5b7cff" stroke-width="2"/><text x="146.0" y="483.0" font-size="17" fill="#e8eaf6" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">Heap</text><text x="146.0" y="504.0" font-size="14" fill="#8890b5" text-anchor="middle" font-weight="400" font-family="Helvetica, Arial, sans-serif">the rows (data)</text><rect x="228" y="436" width="140" height="100" rx="8" fill="#1b2140" stroke="#ff9e7a" stroke-width="2"/><text x="298.0" y="483.0" font-size="17" fill="#e8eaf6" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">Indexes</text><text x="298.0" y="504.0" font-size="14" fill="#8890b5" text-anchor="middle" font-weight="400" font-family="Helvetica, Arial, sans-serif">find rows fast</text><rect x="380" y="436" width="152" height="100" rx="8" fill="#1b2140" stroke="#5b7cff" stroke-width="2"/><text x="456.0" y="483.0" font-size="17" fill="#e8eaf6" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">TOAST</text><text x="456.0" y="504.0" font-size="14" fill="#8890b5" text-anchor="middle" font-weight="400" font-family="Helvetica, Arial, sans-serif">large values</text><rect x="576" y="366" width="180" height="192" rx="10" fill="#161b33" stroke="#c78bff" stroke-width="2"/><text x="666" y="396" font-size="19" fill="#c78bff" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">reports</text><text x="666" y="424" font-size="14" fill="#8890b5" text-anchor="middle" font-weight="400" font-family="Helvetica, Arial, sans-serif">its own tables</text><rect x="768" y="366" width="186" height="192" rx="10" fill="#161b33" stroke="#c78bff" stroke-width="2"/><text x="861" y="396" font-size="19" fill="#c78bff" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">postgres</text><text x="861" y="424" font-size="14" fill="#8890b5" text-anchor="middle" font-weight="400" font-family="Helvetica, Arial, sans-serif">its own tables</text><rect x="30" y="580" width="940" height="60" rx="10" fill="#161b33" stroke="#5a6390" stroke-width="2"/><text x="500" y="606" font-size="18" fill="#e8eaf6" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">Files on disk: the data directory and tablespaces</text><text x="500" y="628" font-size="14" fill="#8890b5" text-anchor="middle" font-weight="400" font-family="Helvetica, Arial, sans-serif">every table, index and TOAST table is a set of files, in base/ or in a tablespace</text></svg>