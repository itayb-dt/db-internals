<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Index demo</title>
<style>
html,body{margin:0;height:100%;background:#0f1324;overflow:hidden}
svg{width:100%;height:100%;display:block}
text{font-family:-apple-system,system-ui,Segoe UI,Helvetica,Arial,sans-serif}
</style></head><body>
<svg id="s" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A table of 24 pages. Without an index the database reads all 24 pages to find one customer. With an index it reads the index root, one leaf, and then one table page.">
 <title>Index demo</title>
</svg>
<script>
(function(){
var NS='http://www.w3.org/2000/svg',LOOP=10,svg=document.getElementById('s');
function clamp(x){return Math.max(0,Math.min(1,x))}
function mk(tag,a,s){var e=document.createElementNS(NS,tag);for(var k in a)e.setAttribute(k,a[k]);if(s!=null)e.textContent=s;svg.appendChild(e);return e}
function box(x,y,w,h,o){o=o||{};var e=mk('rect',{x:x,y:y,width:w,height:h,rx:o.rx==null?6:o.rx,fill:o.fill||'#1b2140',stroke:o.stroke||'#2a3158','stroke-width':o.sw||1.5});e._f=o.fill||'#1b2140';e._s=o.stroke||'#2a3158';return e}
function txt(x,y,s,o){o=o||{};var e=mk('text',{x:x,y:y,'text-anchor':o.a||'middle','font-size':o.size||13,'font-weight':o.b?700:400,fill:o.fill||'#e8eaf6'},s);e._c=o.fill||'#e8eaf6';return e}
function line(x1,y1,x2,y2,o){o=o||{};var e=mk('path',{d:'M'+x1+' '+y1+'L'+x2+' '+y2,stroke:o.stroke||'#2a3158','stroke-width':o.sw||2,fill:'none'});e._s=o.stroke||'#2a3158';return e}
function on(e,f,fill,stroke,w){e.setAttribute('fill',f?fill:e._f);e.setAttribute('stroke',f?stroke:e._s);e.setAttribute('stroke-width',f?(w||3):1.5)}
function lon(e,f,stroke,w){e.setAttribute('stroke',f?stroke:e._s);e.setAttribute('stroke-width',f?(w||3):2)}
function tc(e,f,c){e.setAttribute('fill',f?c:e._c)}
function dot(e,pts,t0,t1,t){if(t<t0||t>t1){e.setAttribute('opacity',0);return}var u=clamp((t-t0)/(t1-t0))*(pts.length-1),i=Math.min(Math.floor(u),pts.length-2),f=u-i;e.setAttribute('cx',pts[i][0]+(pts[i+1][0]-pts[i][0])*f);e.setAttribute('cy',pts[i][1]+(pts[i+1][1]-pts[i][1])*f);e.setAttribute('opacity',1)}
var GREEN='#7ee0a1',YEL='#ffd166',VIO='#c78bff',CY='#4dd0e1',MUTE='#8890b5';
box(20,14,760,30,{rx:8,fill:'#161b33',stroke:'#2a3158'});
var crumb=txt(36,34,'',{a:'start',b:1,size:14});
var cap=txt(400,430,'',{b:1,size:16});
var bar=mk('rect',{x:0,y:446,width:0,height:4,fill:VIO});
var STILL=5;
var STILL=5.0;

txt(274,76,'orders table: 24 pages',{size:12,fill:MUTE});
txt(660,76,'index on customer_id',{size:12,fill:MUTE});
var T=11,pg=[],pl=[];
for(var i=0;i<24;i++){var x=40+(i%6)*78,y=92+Math.floor(i/6)*58;pg.push(box(x,y,70,48));pl.push(txt(x+35,y+29,'page '+(i+1),{size:11,fill:MUTE}))}
var root=box(610,92,100,34,{stroke:CY}),rl=txt(660,114,'root',{b:1}),lv=[],ll=[];
var lx=[545,625,705];
for(var j=0;j<3;j++){lv.push(box(lx[j],190,70,34,{stroke:CY}));ll.push(txt(lx[j]+35,212,'leaf',{size:12,b:1}));line(660,126,lx[j]+35,190,{stroke:'#3a4270'})}
var link=line(625,207,500,174,{stroke:'#3a4270'});
var cnt=txt(274,372,'',{b:1,size:17});
var tip=txt(660,262,'',{size:12,fill:MUTE});
function render(t){
 var A=t<4.8,sc=0;
 crumb.textContent='SELECT * FROM orders WHERE customer_id = 42';
 if(A){sc=Math.floor(clamp((t-0.5)/3.7)*24)}
 for(var i=0;i<24;i++){var read=A&&i<sc;on(pg[i],read,'#3a3358',YEL,2);
  if(i===T)on(pg[i],read,'#1f4a38',GREEN,3)}
 if(!A){on(pg[T],t>=7.6,'#1f4a38',GREEN,4)}
 var step=A?0:(t<5.6?0:t<6.6?1:t<7.6?2:3);
 on(root,step===1,'#2a3158',YEL,3);on(lv[1],step===2,'#2a3158',YEL,3);lon(link,step===3,GREEN,3);
 if(A){cnt.textContent='pages read: '+sc+' of 24';tip.textContent='';
  cap.textContent=t<0.5?'Without an index there is no way to know where the row is.':sc<24?'Sequential scan: the database reads every page.':'All 24 pages read to return one row.'}
 else{var n=step<=1?step:step===2?2:3;cnt.textContent='pages read: '+n+(step===3?'  (2 index + 1 table)':'');
  tip.textContent=step>=1?'walk the index, not the table':'';
  cap.textContent=t<5.6?'With an index on customer_id...':step===1?'Start at the root of the index.':step===2?'Follow it to the leaf that holds 42.':'The leaf points to the page. Read just that one.'}
 for(var k=0;k<3;k++)if(k!==1)on(lv[k],false);
}

var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(t){render(t);bar.setAttribute('width',800*t/LOOP)}
if(reduce){draw(STILL);return}
var t0=performance.now();
(function frame(now){draw(Math.max(0,(now-t0)/1000)%LOOP);requestAnimationFrame(frame)})(t0);
})();
</script></body></html>
