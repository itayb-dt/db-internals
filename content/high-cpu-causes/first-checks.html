<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>High CPU demo</title>
<style>
html,body{margin:0;height:100%;background:#0f1324;overflow:hidden}
svg{width:100%;height:100%;display:block}
text{font-family:-apple-system,system-ui,Segoe UI,Helvetica,Arial,sans-serif}
</style></head><body>
<svg id="s" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="The CPU of the host is split into user, system, waiting for disk and idle. Then the processes are checked. One process at a full core means one expensive session. Many processes with a little each mean the whole workload is too big.">
 <title>High CPU demo</title>
</svg>
<script>
(function(){
var NS='http://www.w3.org/2000/svg',LOOP=26,svg=document.getElementById('s');
function clamp(x){return Math.max(0,Math.min(1,x))}
function mk(tag,a,s){var e=document.createElementNS(NS,tag);for(var k in a)e.setAttribute(k,a[k]);if(s!=null)e.textContent=s;svg.appendChild(e);return e}
function box(x,y,w,h,o){o=o||{};var e=mk('rect',{x:x,y:y,width:w,height:h,rx:o.rx==null?6:o.rx,fill:o.fill||'#1b2140',stroke:o.stroke||'#2a3158','stroke-width':o.sw||1.5});e._f=o.fill||'#1b2140';e._s=o.stroke||'#2a3158';return e}
function txt(x,y,s,o){o=o||{};var e=mk('text',{x:x,y:y,'text-anchor':o.a||'middle','font-size':o.size||13,'font-weight':o.b?700:400,fill:o.fill||'#e8eaf6'},s);e._c=o.fill||'#e8eaf6';return e}
function line(x1,y1,x2,y2,o){o=o||{};var e=mk('path',{d:'M'+x1+' '+y1+'L'+x2+' '+y2,stroke:o.stroke||'#2a3158','stroke-width':o.sw||2,fill:'none'});e._s=o.stroke||'#2a3158';return e}
function on(e,f,fill,stroke,w){e.setAttribute('fill',f?fill:e._f);e.setAttribute('stroke',f?stroke:e._s);e.setAttribute('stroke-width',f?(w||3):1.5)}
function lon(e,f,stroke,w){e.setAttribute('stroke',f?stroke:e._s);e.setAttribute('stroke-width',f?(w||3):2)}
function tc(e,f,c){e.setAttribute('fill',f?c:e._c)}
function dot(e,pts,t0,t1,t){if(t<t0||t>t1){e.setAttribute('opacity',0);return}var u=clamp((t-t0)/(t1-t0))*(pts.length-1),i=Math.min(Math.floor(u),pts.length-2),f=u-i;e.setAttribute('cx',pts[i][0]+(pts[i+1][0]-pts[i][0])*f);e.setAttribute('cy',pts[i][1]+(pts[i+1][1]-pts[i][1])*f);e.setAttribute('opacity',1)}
var GREEN='#7ee0a1',YEL='#ffd166',VIO='#c78bff',CY='#4dd0e1',MUTE='#8890b5';
box(20,14,760,30,{rx:8,fill:'#161b33',stroke:'#2a3158'});
var crumb=txt(36,34,'',{a:'start',b:1,size:14});
var cap=txt(400,430,'',{b:1,size:16});
var bar=mk('rect',{x:0,y:446,width:0,height:4,fill:VIO});
var STILL=24;

function vis(e,v){e.setAttribute('opacity',v?1:0)}
function op(e,v){e.setAttribute('opacity',v)}
function prog(t,a,b){return clamp((t-a)/(b-a))}
function ease(x){x=clamp(x);return x*x*(3-2*x)}
function wid(e,w){e.setAttribute('width',Math.max(0,w))}
function put(e,x,y){e.setAttribute('x',x);e.setAttribute('y',y)}
function grp(list,v){list.forEach(function(e){vis(e,v)})}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
var cap2=txt(400,424,'',{size:14,fill:'#cfd3f0'});cap.setAttribute('y',398);
function say(a,b){cap.textContent=a||'';cap2.textContent=b||''}

crumb.textContent='The CPU is high: where does it go?';
var BX=60,BW=680;
var SN=[['user','#5b7cff'],['system','#ff9e7a'],['waiting for disk','#4dd0e1'],['idle','#2a3158']];
var bkg=box(BX,100,BW,46,{rx:6}),sg=[],sv=[],sl=[],sq=[];
SN.forEach(function(s,i){sg.push(box(BX,100,10,46,{rx:0,fill:s[1],stroke:'#0f1324'}));sv.push(txt(0,128,'',{b:1,size:13,fill:'#0f1324'}));sq.push(box(70+i*165,170,12,12,{fill:s[1],stroke:s[1],rx:3}));sl.push(txt(88+i*165,181,s[0],{a:'start',size:12,fill:'#cfd3f0'}))});
var hd=txt(400,84,'CPU of the host',{b:1,size:14,fill:MUTE});
var PR=[],PB=[],PF=[],PV=[];
for(var i=0;i<8;i++){var y=96+i*32;PR.push(txt(60,y+14,'process '+(4120+i*7),{a:'start',size:12,fill:'#cfd3f0'}));PB.push(box(180,y,430,18,{rx:5}));PF.push(box(180,y,2,18,{rx:5,fill:YEL,stroke:YEL}));PV.push(txt(620,y+14,'',{a:'start',size:12,b:1}))}
var ph=txt(180,84,'one row for each process (each connection is a process)',{a:'start',size:12,fill:MUTE});
var cnt=box(180,360,430,0,{});
var cmp=txt(400,360,'',{b:1,size:16,fill:YEL});
var GBAR=[bkg,hd].concat(sg,sv,sl,sq),GP=[ph].concat(PR,PB,PF,PV);
var legB=[];
function render(t){
 var s1=t<9;grp(GBAR,s1);grp(GP,!s1);vis(cmp,false);
 // legend squares are static boxes: hide them after scene 1 by opacity on svg children is complex, so they stay behind the list
 if(s1){var A=[85,5,2,8],B=[15,10,60,15],f=ease(prog(t,4.4,5.8)),vals=[0,1,2,3].map(function(i){return A[i]+(B[i]-A[i])*f}),acc=0;
  for(var i=0;i<4;i++){var w=BW*vals[i]/100;sg[i].setAttribute('x',BX+acc);wid(sg[i],w);put(sv[i],BX+acc+w/2,128);sv[i].textContent=vals[i]>=6?Math.round(vals[i])+'%':'';sv[i].setAttribute('text-anchor','middle');acc+=w}
  if(t<4.4)say('Split the CPU: mostly user time.','The database is computing: queries, sorts, joins.');
  else say('Or mostly waiting for disk.','Then the CPU graph misleads: the disk is the limit, not the CPU.')}
 else{var one=t<17,T=t-(one?9:17),V=one?[98,2,2,1,1,1,0,0]:[14,12,11,13,9,12,10,11],e=ease(prog(T,0.8,3.2));
  for(var i=0;i<8;i++){wid(PF[i],4.3*V[i]*e+2);PV[i].textContent=Math.round(V[i]*e)+'%';PF[i].setAttribute('fill',one&&i===0?'#ff6b6b':YEL);PF[i].setAttribute('stroke',one&&i===0?'#ff6b6b':YEL)}
  if(one)say('One process uses almost a whole core.','One session is expensive, or stuck in a loop.');
  else{say('Many processes each use a little.','The whole workload is too big for the host.');
   if(T>4){vis(cmp,true);cmp.textContent='sessions running: 24   |   cores: 8   |   count them, then compare'}}}
 if(!s1&&t>=22.5)say('Count the sessions that run on the CPU.','If far more run than there are cores, they queue and everything slows.');
}
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(t){render(t);bar.setAttribute('width',800*t/LOOP)}
if(reduce){draw(STILL);return}
var t0=performance.now();
(function frame(now){draw(Math.max(0,(now-t0)/1000)%LOOP);requestAnimationFrame(frame)})(t0);
})();
</script></body></html>
