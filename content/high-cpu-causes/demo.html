<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cause checklist demo</title>
<style>
html,body{margin:0;height:100%;background:#0f1324;overflow:hidden}
svg{width:100%;height:100%;display:block}
text{font-family:-apple-system,system-ui,Segoe UI,Helvetica,Arial,sans-serif}
</style></head><body>
<svg id="s" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A list of causes of high CPU checked one at a time. Not enough resources, a runaway query, more requests and overlapping jobs are each rejected by a question. Costly statements is confirmed because a few statements dominate the total time, and the rest are not needed.">
 <title>Cause checklist demo</title>
</svg>
<script>
(function(){
var NS='http://www.w3.org/2000/svg',LOOP=30,svg=document.getElementById('s');
function clamp(x){return Math.max(0,Math.min(1,x))}
function mk(tag,a,s){var e=document.createElementNS(NS,tag);for(var k in a)e.setAttribute(k,a[k]);if(s!=null)e.textContent=s;svg.appendChild(e);return e}
function box(x,y,w,h,o){o=o||{};var e=mk('rect',{x:x,y:y,width:w,height:h,rx:o.rx==null?6:o.rx,fill:o.fill||'#1b2140',stroke:o.stroke||'#2a3158','stroke-width':o.sw||1.5});e._f=o.fill||'#1b2140';e._s=o.stroke||'#2a3158';return e}
function txt(x,y,s,o){o=o||{};var e=mk('text',{x:x,y:y,'text-anchor':o.a||'middle','font-size':o.size||13,'font-weight':o.b?700:400,fill:o.fill||'#e8eaf6'},s);e._c=o.fill||'#e8eaf6';return e}
function line(x1,y1,x2,y2,o){o=o||{};var e=mk('path',{d:'M'+x1+' '+y1+'L'+x2+' '+y2,stroke:o.stroke||'#2a3158','stroke-width':o.sw||2,fill:'none'});e._s=o.stroke||'#2a3158';return e}
function on(e,f,fill,stroke,w){e.setAttribute('fill',f?fill:e._f);e.setAttribute('stroke',f?stroke:e._s);e.setAttribute('stroke-width',f?(w||3):1.5)}
function lon(e,f,stroke,w){e.setAttribute('stroke',f?stroke:e._s);e.setAttribute('stroke-width',f?(w||3):2)}
function tc(e,f,c){e.setAttribute('fill',f?c:e._c)}
function dot(e,pts,t0,t1,t){if(t<t0||t>t1){e.setAttribute('opacity',0);return}var u=clamp((t-t0)/(t1-t0))*(pts.length-1),i=Math.min(Math.floor(u),pts.length-2),f=u-i;e.setAttribute('cx',pts[i][0]+(pts[i+1][0]-pts[i][0])*f);e.setAttribute('cy',pts[i][1]+(pts[i+1][1]-pts[i][1])*f);e.setAttribute('opacity',1)}
var GREEN='#7ee0a1',YEL='#ffd166',VIO='#c78bff',CY='#4dd0e1',MUTE='#8890b5';
box(20,14,760,30,{rx:8,fill:'#161b33',stroke:'#2a3158'});
var crumb=txt(36,34,'',{a:'start',b:1,size:14});
var cap=txt(400,430,'',{b:1,size:16});
var bar=mk('rect',{x:0,y:446,width:0,height:4,fill:VIO});
var STILL=29;

function vis(e,v){e.setAttribute('opacity',v?1:0)}
function op(e,v){e.setAttribute('opacity',v)}
function prog(t,a,b){return clamp((t-a)/(b-a))}
function ease(x){x=clamp(x);return x*x*(3-2*x)}
function wid(e,w){e.setAttribute('width',Math.max(0,w))}
function put(e,x,y){e.setAttribute('x',x);e.setAttribute('y',y)}
function grp(list,v){list.forEach(function(e){vis(e,v)})}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
var cap2=txt(400,424,'',{size:14,fill:'#cfd3f0'});cap.setAttribute('y',398);
function say(a,b){cap.textContent=a||'';cap2.textContent=b||''}

crumb.textContent='High CPU: check the causes one at a time';
var CZ=[['Not enough resources for the workload','High all day, in proportion to the load?','No. It was fine last week with the same load.',0],
 ['A runaway query','One process at a full core?','No. Many processes share the load.',0],
 ['More requests than usual','Statements per second above a normal day?','No. About the same as usual.',0],
 ['Jobs overlap','Did the CPU jump at a fixed time?','No. It followed the traffic of the day.',0],
 ['Costly statements','Do a few statements dominate the total time?','Yes. Three statements use most of it, and they scan whole tables.',1],
 ['Too many active sessions','',"",2],['Maintenance work','','',2],['A replication problem','','',2],['Waiting on disk','','',2],['Something else on the host','','',2]];
var RW=[];
CZ.forEach(function(c,i){var y=58+i*32;var b=box(60,y,680,26,{rx:7,stroke:'#3a4270'}),n=txt(78,y+18,(i+1)+'   '+c[0],{a:'start',size:14,b:1}),s=txt(722,y+18,'',{a:'end',size:12,b:1});RW.push({b:b,n:n,s:s})});
function stt(r,k){var m={wait:['#1b2140','#3a4270','#e8eaf6','',MUTE],test:['#2a3158',YEL,'#e8eaf6','checking',YEL],rej:['#14182e','#4a5170','#7a82a8','not it','#7a82a8'],ok:['#1f4a38',GREEN,'#e8eaf6','found',GREEN],skip:['#161b33','#2a3158','#6a7090','not needed',MUTE]}[k];
 r.b.setAttribute('fill',m[0]);r.b.setAttribute('stroke',m[1]);r.b.setAttribute('stroke-width',k==='ok'||k==='test'?3:1.5);r.n.setAttribute('fill',m[2]);r.s.textContent=m[3];r.s.setAttribute('fill',m[4])}
function render(t){
 var cur=-1,phase='intro';
 for(var i=0;i<5;i++){var a=3+i*4.4;if(t>=a&&t<a+4.4){cur=i;phase=t<a+2.4?'check':'result'}}
 if(t>=3+5*4.4)phase='done';
 for(var i=0;i<10;i++){var k='wait';
  if(i<5){var a=3+i*4.4;if(t>=a+2.4)k=i===4?'ok':'rej';else if(t>=a)k='test'}
  else if(t>=3+5*4.4)k='skip';
  stt(RW[i],k)}
 if(phase==='intro')say('The CPU is high. What is the cause?','Check the causes one at a time. Each has a question that confirms or rejects it.');
 else if(phase==='check')say('Check: '+CZ[cur][1],'');
 else if(phase==='result')say(CZ[cur][2],cur===4?'Confirmed.':'Rejected.');
 else say('Confirmed cause: costly statements.','Next: read their plans, then fix them.');
}
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(t){render(t);bar.setAttribute('width',800*t/LOOP)}
if(reduce){draw(STILL);return}
var t0=performance.now();
(function frame(now){draw(Math.max(0,(now-t0)/1000)%LOOP);requestAnimationFrame(frame)})(t0);
})();
</script></body></html>
