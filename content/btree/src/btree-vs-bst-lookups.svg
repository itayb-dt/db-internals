<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img"><title>B-tree depth and balance compared with a binary search tree</title><desc>Bar chart of lookup steps for a million keys, and a diagram showing a binary tree degenerating into a chain under sorted inserts while a B-tree splits pages and stays balanced.</desc><rect width="1200" height="500" fill="#0f1324"/><text x="600" y="40" font-size="22" fill="#e8eaf6" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">Why the B-tree stays shallow and balanced</text><text x="300" y="85" font-size="17" fill="#e8eaf6" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">Steps to find one key among 1,000,000</text><text x="98" y="150" font-size="15" fill="#e8eaf6" text-anchor="end" font-weight="400" font-family="Helvetica, Arial, sans-serif">Binary tree</text><rect x="110" y="130" width="360" height="32" fill="#5b7cff" rx="4"/><text x="478" y="152" font-size="15" fill="#e8eaf6" text-anchor="start" font-weight="400" font-family="Helvetica, Arial, sans-serif">~20 nodes</text><text x="98" y="215" font-size="15" fill="#e8eaf6" text-anchor="end" font-weight="400" font-family="Helvetica, Arial, sans-serif">B-tree</text><rect x="110" y="195" width="54" height="32" fill="#ff9e7a" rx="4"/><text x="172.0" y="217" font-size="15" fill="#e8eaf6" text-anchor="start" font-weight="400" font-family="Helvetica, Arial, sans-serif">~3 pages</text><text x="300" y="290" font-size="14" fill="#8890b5" text-anchor="middle" font-weight="400" font-family="Helvetica, Arial, sans-serif">Illustrative: log2(1,000,000) is about 20, while a page that holds</text><text x="300" y="312" font-size="14" fill="#8890b5" text-anchor="middle" font-weight="400" font-family="Helvetica, Arial, sans-serif">a few hundred keys needs about 3 levels. Real fan-out depends on key size.</text><text x="300" y="360" font-size="15" fill="#e8eaf6" text-anchor="middle" font-weight="400" font-family="Helvetica, Arial, sans-serif">A binary tree has 2 children per node.</text><text x="300" y="384" font-size="15" fill="#e8eaf6" text-anchor="middle" font-weight="400" font-family="Helvetica, Arial, sans-serif">A B-tree page has hundreds, so it is far shallower.</text><line x1="600" y1="70" x2="600" y2="480" stroke="#2a3158" stroke-width="1" stroke-dasharray="4 6"/><text x="900" y="85" font-size="17" fill="#e8eaf6" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">Inserting keys in sorted order</text><text x="640" y="130" font-size="15" fill="#5b7cff" text-anchor="start" font-weight="700" font-family="Helvetica, Arial, sans-serif">Plain binary tree</text><line x1="680" y1="150" x2="718" y2="176" stroke="#5a6390" stroke-width="2"/><line x1="718" y1="176" x2="756" y2="202" stroke="#5a6390" stroke-width="2"/><line x1="756" y1="202" x2="794" y2="228" stroke="#5a6390" stroke-width="2"/><line x1="794" y1="228" x2="832" y2="254" stroke="#5a6390" stroke-width="2"/><line x1="832" y1="254" x2="870" y2="280" stroke="#5a6390" stroke-width="2"/><circle cx="680" cy="150" r="13" fill="#5b7cff"/><text x="680" y="155" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" font-family="Helvetica, Arial, sans-serif">1</text><circle cx="718" cy="176" r="13" fill="#5b7cff"/><text x="718" y="181" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" font-family="Helvetica, Arial, sans-serif">2</text><circle cx="756" cy="202" r="13" fill="#5b7cff"/><text x="756" y="207" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" font-family="Helvetica, Arial, sans-serif">3</text><circle cx="794" cy="228" r="13" fill="#5b7cff"/><text x="794" y="233" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" font-family="Helvetica, Arial, sans-serif">4</text><circle cx="832" cy="254" r="13" fill="#5b7cff"/><text x="832" y="259" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" font-family="Helvetica, Arial, sans-serif">5</text><circle cx="870" cy="280" r="13" fill="#5b7cff"/><text x="870" y="285" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" font-family="Helvetica, Arial, sans-serif">6</text><text x="970" y="200" font-size="14" fill="#8890b5" text-anchor="start" font-weight="400" font-family="Helvetica, Arial, sans-serif">degenerates into a chain:</text><text x="970" y="220" font-size="14" fill="#8890b5" text-anchor="start" font-weight="400" font-family="Helvetica, Arial, sans-serif">a lookup may walk all n nodes</text><text x="640" y="350" font-size="15" fill="#ff9e7a" text-anchor="start" font-weight="700" font-family="Helvetica, Arial, sans-serif">B-tree</text><rect x="780" y="330" width="34" height="34" fill="#7ee0a1" stroke="#0f1324" stroke-width="2" rx="3"/><text x="797.0" y="352.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">3</text><rect x="814" y="330" width="34" height="34" fill="#7ee0a1" stroke="#0f1324" stroke-width="2" rx="3"/><text x="831.0" y="352.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">5</text><rect x="686.0" y="400" width="34" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="703.0" y="422.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">1</text><rect x="720.0" y="400" width="34" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="737.0" y="422.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">2</text><line x1="814" y1="364" x2="720" y2="400" stroke="#5a6390" stroke-width="2"/><rect x="781.0" y="400" width="34" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="798.0" y="422.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">3</text><rect x="815.0" y="400" width="34" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="832.0" y="422.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">4</text><line x1="814" y1="364" x2="815" y2="400" stroke="#5a6390" stroke-width="2"/><rect x="874.0" y="400" width="34" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="891.0" y="422.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">5</text><rect x="908.0" y="400" width="34" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="925.0" y="422.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">6</text><rect x="942.0" y="400" width="34" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="959.0" y="422.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">7</text><line x1="814" y1="364" x2="925" y2="400" stroke="#5a6390" stroke-width="2"/><text x="1000" y="370" font-size="13" fill="#8890b5" text-anchor="start" font-weight="400" font-family="Helvetica, Arial, sans-serif">a full page splits in two,</text><text x="1000" y="390" font-size="13" fill="#8890b5" text-anchor="start" font-weight="400" font-family="Helvetica, Arial, sans-serif">the parent gains a key:</text><text x="1000" y="410" font-size="13" fill="#8890b5" text-anchor="start" font-weight="400" font-family="Helvetica, Arial, sans-serif">depth stays equal everywhere</text></svg>