<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img"><title>B-tree compared with a binary search tree for the same 15 keys</title><desc>A binary search tree with four levels and one key per node, next to a B-tree with a root page and three leaf pages holding many keys each.</desc><rect width="1200" height="510" fill="#0f1324"/><text x="600" y="40" font-size="22" fill="#e8eaf6" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">The same 15 keys in a binary search tree and in a B-tree</text><line x1="300" y1="110" x2="150" y2="190" stroke="#5a6390" stroke-width="2"/><line x1="300" y1="110" x2="450" y2="190" stroke="#5a6390" stroke-width="2"/><line x1="150" y1="190" x2="75" y2="270" stroke="#5a6390" stroke-width="2"/><line x1="150" y1="190" x2="225" y2="270" stroke="#5a6390" stroke-width="2"/><line x1="450" y1="190" x2="375" y2="270" stroke="#5a6390" stroke-width="2"/><line x1="450" y1="190" x2="525" y2="270" stroke="#5a6390" stroke-width="2"/><line x1="75" y1="270" x2="37" y2="350" stroke="#5a6390" stroke-width="2"/><line x1="75" y1="270" x2="113" y2="350" stroke="#5a6390" stroke-width="2"/><line x1="225" y1="270" x2="187" y2="350" stroke="#5a6390" stroke-width="2"/><line x1="225" y1="270" x2="263" y2="350" stroke="#5a6390" stroke-width="2"/><line x1="375" y1="270" x2="337" y2="350" stroke="#5a6390" stroke-width="2"/><line x1="375" y1="270" x2="413" y2="350" stroke="#5a6390" stroke-width="2"/><line x1="525" y1="270" x2="487" y2="350" stroke="#5a6390" stroke-width="2"/><line x1="525" y1="270" x2="563" y2="350" stroke="#5a6390" stroke-width="2"/><circle cx="300" cy="110" r="17" fill="#5b7cff"/><text x="300" y="115" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" font-family="Helvetica, Arial, sans-serif">80</text><circle cx="150" cy="190" r="17" fill="#5b7cff"/><text x="150" y="195" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" font-family="Helvetica, Arial, sans-serif">40</text><circle cx="450" cy="190" r="17" fill="#5b7cff"/><text x="450" y="195" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" font-family="Helvetica, Arial, sans-serif">120</text><circle cx="75" cy="270" r="17" fill="#5b7cff"/><text x="75" y="275" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" font-family="Helvetica, Arial, sans-serif">20</text><circle cx="225" cy="270" r="17" fill="#5b7cff"/><text x="225" y="275" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" font-family="Helvetica, Arial, sans-serif">60</text><circle cx="375" cy="270" r="17" fill="#5b7cff"/><text x="375" y="275" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" font-family="Helvetica, Arial, sans-serif">100</text><circle cx="525" cy="270" r="17" fill="#5b7cff"/><text x="525" y="275" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" font-family="Helvetica, Arial, sans-serif">140</text><circle cx="37" cy="350" r="17" fill="#5b7cff"/><text x="37" y="355" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" font-family="Helvetica, Arial, sans-serif">10</text><circle cx="113" cy="350" r="17" fill="#5b7cff"/><text x="113" y="355" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" font-family="Helvetica, Arial, sans-serif">30</text><circle cx="187" cy="350" r="17" fill="#5b7cff"/><text x="187" y="355" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" font-family="Helvetica, Arial, sans-serif">50</text><circle cx="263" cy="350" r="17" fill="#5b7cff"/><text x="263" y="355" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" font-family="Helvetica, Arial, sans-serif">70</text><circle cx="337" cy="350" r="17" fill="#5b7cff"/><text x="337" y="355" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" font-family="Helvetica, Arial, sans-serif">90</text><circle cx="413" cy="350" r="17" fill="#5b7cff"/><text x="413" y="355" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" font-family="Helvetica, Arial, sans-serif">110</text><circle cx="487" cy="350" r="17" fill="#5b7cff"/><text x="487" y="355" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" font-family="Helvetica, Arial, sans-serif">130</text><circle cx="563" cy="350" r="17" fill="#5b7cff"/><text x="563" y="355" font-size="13" fill="#fff" text-anchor="middle" font-weight="600" font-family="Helvetica, Arial, sans-serif">150</text><text x="300" y="75" font-size="18" fill="#5b7cff" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">Binary search tree</text><text x="300" y="420" font-size="16" fill="#e8eaf6" text-anchor="middle" font-weight="400" font-family="Helvetica, Arial, sans-serif">4 levels, 1 key per node</text><text x="300" y="448" font-size="15" fill="#8890b5" text-anchor="middle" font-weight="400" font-family="Helvetica, Arial, sans-serif">A lookup visits up to 4 nodes.</text><text x="300" y="472" font-size="15" fill="#8890b5" text-anchor="middle" font-weight="400" font-family="Helvetica, Arial, sans-serif">Each node can sit on a different disk page.</text><line x1="600" y1="70" x2="600" y2="500" stroke="#2a3158" stroke-width="1" stroke-dasharray="4 6"/><text x="900" y="75" font-size="18" fill="#ff9e7a" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">B-tree (as used by PostgreSQL)</text><rect x="870.0" y="130" width="30" height="34" fill="#7ee0a1" stroke="#0f1324" stroke-width="2" rx="3"/><text x="885.0" y="152.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">50</text><rect x="900.0" y="130" width="30" height="34" fill="#7ee0a1" stroke="#0f1324" stroke-width="2" rx="3"/><text x="915.0" y="152.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">100</text><rect x="640.0" y="300" width="30" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="655.0" y="322.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">10</text><rect x="670.0" y="300" width="30" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="685.0" y="322.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">20</text><rect x="700.0" y="300" width="30" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="715.0" y="322.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">30</text><rect x="730.0" y="300" width="30" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="745.0" y="322.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">40</text><line x1="900" y1="164" x2="700" y2="300" stroke="#5a6390" stroke-width="2"/><rect x="820.0" y="300" width="30" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="835.0" y="322.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">50</text><rect x="850.0" y="300" width="30" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="865.0" y="322.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">60</text><rect x="880.0" y="300" width="30" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="895.0" y="322.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">70</text><rect x="910.0" y="300" width="30" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="925.0" y="322.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">80</text><rect x="940.0" y="300" width="30" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="955.0" y="322.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">90</text><line x1="900" y1="164" x2="895" y2="300" stroke="#5a6390" stroke-width="2"/><rect x="995.0" y="300" width="30" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="1010.0" y="322.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">100</text><rect x="1025.0" y="300" width="30" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="1040.0" y="322.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">110</text><rect x="1055.0" y="300" width="30" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="1070.0" y="322.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">120</text><rect x="1085.0" y="300" width="30" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="1100.0" y="322.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">130</text><rect x="1115.0" y="300" width="30" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="1130.0" y="322.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">140</text><rect x="1145.0" y="300" width="30" height="34" fill="#ff9e7a" stroke="#0f1324" stroke-width="2" rx="3"/><text x="1160.0" y="322.0" font-size="13" fill="#1a1d33" text-anchor="middle" font-weight="700" font-family="Helvetica, Arial, sans-serif">150</text><line x1="900" y1="164" x2="1085" y2="300" stroke="#5a6390" stroke-width="2"/><line x1="760" y1="317" x2="820" y2="317" stroke="#8890b5" stroke-width="2" stroke-dasharray="3 3"/><line x1="970" y1="317" x2="995" y2="317" stroke="#8890b5" stroke-width="2" stroke-dasharray="3 3"/><text x="900" y="118" font-size="14" fill="#8890b5" text-anchor="middle" font-weight="400" font-family="Helvetica, Arial, sans-serif">root page: separator keys</text><text x="900" y="360" font-size="14" fill="#8890b5" text-anchor="middle" font-weight="400" font-family="Helvetica, Arial, sans-serif">leaf pages: all keys, sorted, linked to the next leaf</text><text x="900" y="420" font-size="16" fill="#e8eaf6" text-anchor="middle" font-weight="400" font-family="Helvetica, Arial, sans-serif">2 levels, many keys per node</text><text x="900" y="448" font-size="15" fill="#8890b5" text-anchor="middle" font-weight="400" font-family="Helvetica, Arial, sans-serif">A lookup reads 2 pages.</text><text x="900" y="472" font-size="15" fill="#8890b5" text-anchor="middle" font-weight="400" font-family="Helvetica, Arial, sans-serif">Each node is one 8 kB page, so one read brings many keys.</text></svg>