subject: Concurrency
color: "#ffd166"
order: 5
description: "What happens when many sessions touch the same data at once: locks, waiting and deadlocks."
topics:
  - id: mvcc
    name: MVCC
    domain: Isolation
    level: 1
    description: "Multiversion concurrency control. PostgreSQL keeps several versions of a row, and each statement or transaction sees a consistent snapshot, so readers and writers do not block each other."
    details: |
      An `UPDATE` writes a new row version and leaves the old one in place for transactions that may still need it.
      Every version records the transaction that created it (`xmin`) and the one that deleted it (`xmax`).
    evidence:
      - Show xmin, xmax and ctid change after an UPDATE
      - Explain why a SELECT does not wait for an UPDATE on the same row
      - Say what a Read Committed statement and a Repeatable Read transaction can each see
      - Explain why MVCC creates dead rows that need vacuum
    prerequisites:
      - {id: tuple, reason: A tuple is one row version and MVCC is about keeping several}

  - id: deadlock
    name: Deadlock
    domain: Locking
    level: 2
    description: Two or more transactions each hold a lock the other needs, so none can continue. PostgreSQL detects it and aborts one of them.
    details: |
      The aborted transaction gets error `40P01` and must be retried by the application.
      The usual cause is two transactions locking the same rows in a different order.
    evidence:
      - Build a deadlock with two sessions and two rows
      - Explain why PostgreSQL waits deadlock_timeout before it checks for a deadlock
      - Find blocked sessions and their blockers with pg_blocking_pids
      - Name two ways to prevent deadlocks and what the application must do when one still happens
    prerequisites:
      - {id: tuple, reason: Row-level locks protect the row versions a transaction changes}
      - {id: mvcc, reason: MVCC lets readers and writers pass each other so deadlocks involve writers only, strength: soft}

  - id: wraparound
    name: Transaction ID wraparound
    domain: Transaction IDs
    level: 3
    description: "Transaction IDs are 32-bit numbers that wrap around. Rows older than about two billion transactions would suddenly look like they are in the future, so vacuum must freeze them in time. If it cannot, PostgreSQL stops accepting writes."
    details: |
      Vacuum prevents the problem by marking old rows as frozen, so they stay visible whatever the counter does.
      Autovacuum starts a forced vacuum on any table close to the limit, even if autovacuum is turned off.
    evidence:
      - Explain why a row would become invisible after two billion transactions
      - Say what freezing does and which setting makes autovacuum start a forced vacuum
      - Find the age of the oldest unfrozen transaction ID per database and per table
      - Name the things that can stop vacuum from advancing the age
      - List the steps to recover from the "not accepting commands" error
    prerequisites:
      - {id: mvcc, reason: Transaction IDs are how row versions are ordered and judged visible}
      - {id: vacuum, reason: Vacuum is what freezes old rows}
      - {id: visibility-map, reason: The all-frozen bit lets vacuum skip pages it already froze, strength: soft}

