subject: Storage
color: "#5b7cff"
topics:
  - id: page
    name: Page
    domain: Pages & rows
    level: 0
    description: Fixed-size block (for example 8 KB) that is the unit of disk I/O and caching.
    evidence:
      - Explain why databases read and write whole pages, not single rows
      - Describe what a page contains (header, row pointers, row data)
    prerequisites: []

  - id: tuple
    name: Tuple (row)
    domain: Pages & rows
    level: 1
    description: One stored version of a row, living inside a page.
    evidence:
      - Explain that an UPDATE can create a new tuple instead of overwriting the old one
    prerequisites:
      - {id: page, reason: Tuples are stored inside pages}

  - id: heap
    name: Heap table
    domain: Pages & rows
    level: 1
    description: Unordered collection of pages holding all tuples of a table.
    evidence:
      - Explain why a table without an index must be scanned page by page
    prerequisites:
      - {id: page, reason: A heap is a set of pages}
      - {id: tuple, reason: A heap stores tuples}

  - id: buffer
    name: Buffer pool
    domain: Memory & large values
    level: 2
    description: In-memory cache of pages shared by all connections.
    evidence:
      - Explain the difference between a cache hit and a disk read
    prerequisites:
      - {id: page, reason: The cache holds whole pages}

  - id: toast
    name: TOAST
    domain: Memory & large values
    level: 2
    description: PostgreSQL stores values that make a row too wide (over about 2 kB) compressed and/or in a hidden side table, leaving only a pointer in the row.
    details: |
      Applies to variable-length types such as `text`, `jsonb` and `bytea`, up to 1 GB per value.
      Each column has a storage strategy: `PLAIN`, `MAIN`, `EXTERNAL` or `EXTENDED`.
      Selecting wide columns costs extra reads, and rewriting a large value leaves dead chunks for vacuum.
    evidence:
      - Explain why a row can be larger than a page
      - Name the four storage strategies and say when you would pick EXTERNAL
      - Find how much of a table's size is in its TOAST table
      - Explain why a large jsonb update rewrites the whole document
      - Choose between bytea, Large Objects and object storage for a 5 MB image
    prerequisites:
      - {id: heap, reason: Large values are moved out of the heap row}
      - {id: tuple, reason: The tuple keeps only a pointer to the large value}
