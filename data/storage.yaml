subject: Storage
color: "#5b7cff"
order: 1
description: "How a database lays data out on disk: pages, rows, tables, caching and large values, and how space is reclaimed."
topics:
  - id: page
    name: Page
    domain: Pages & rows
    level: 0
    description: Fixed-size block (for example 8 KB) that is the unit of disk I/O and caching.
    evidence:
      - Explain why databases read and write whole pages, not single rows
      - Describe what a page contains (header, row pointers, row data)
    prerequisites: []

  - id: tuple
    name: Tuple (row)
    domain: Pages & rows
    level: 1
    description: One stored version of a row, living inside a page.
    evidence:
      - Explain that an UPDATE can create a new tuple instead of overwriting the old one
    prerequisites:
      - {id: page, reason: Tuples are stored inside pages}

  - id: heap
    name: Heap table
    domain: Pages & rows
    level: 1
    description: Unordered collection of pages holding all tuples of a table.
    evidence:
      - Explain why a table without an index must be scanned page by page
    prerequisites:
      - {id: page, reason: A heap is a set of pages}
      - {id: tuple, reason: A heap stores tuples}

  - id: buffer
    name: Buffer pool
    domain: Memory & large values
    level: 2
    description: "The shared memory cache of table and index pages. Queries read and change pages in the pool, never single rows, and dirty pages are written to disk later."
    details: |
      A page that is already in the pool is a hit. A page that is not is a miss: the pool evicts a page nobody needs and reads the whole page from disk.
      A change marks the whole page dirty, after a log record is written, and a checkpoint or the background writer flushes it later.
    evidence:
      - Explain the difference between a cache hit and a disk read
      - Say why changing one value in one row still reads and writes a whole page
      - Read shared hit, read and dirtied in EXPLAIN with BUFFERS
      - Explain why a dirty page can stay in memory after the commit
    prerequisites:
      - {id: page, reason: The cache holds whole pages}
      - {id: tuple, reason: Rows live inside pages and are read and changed through them, strength: soft}

  - id: toast
    name: TOAST
    domain: Memory & large values
    level: 2
    description: PostgreSQL stores values that make a row too wide (over about 2 kB) compressed and/or in a hidden side table, leaving only a pointer in the row.
    details: |
      Applies to variable-length types such as `text`, `jsonb` and `bytea`, up to 1 GB per value.
      Each column has a storage strategy: `PLAIN`, `MAIN`, `EXTERNAL` or `EXTENDED`.
      Selecting wide columns costs extra reads, and rewriting a large value leaves dead chunks for vacuum.
    evidence:
      - Explain why a row can be larger than a page
      - Name the four storage strategies and say when you would pick EXTERNAL
      - Find how much of a table's size is in its TOAST table
      - Explain why a large jsonb update rewrites the whole document
      - Choose between bytea, Large Objects and object storage for a 5 MB image
    prerequisites:
      - {id: heap, reason: Large values are moved out of the heap row}
      - {id: tuple, reason: The tuple keeps only a pointer to the large value}

  - id: dead-rows
    name: Dead rows
    domain: Row versions
    level: 2
    description: Old row versions left behind by UPDATE and DELETE. They keep taking space and slow scans until vacuum reclaims them.
    details: |
      PostgreSQL does not overwrite a row when it changes. It writes a new version and leaves the old one for transactions that may still need it.
      The count of dead rows is the first signal of table bloat.
    evidence:
      - Explain why a DELETE does not make a table smaller
      - Find the dead rows of a table with n_dead_tup
      - Explain why a long-running transaction can keep dead rows from being removed
    prerequisites:
      - {id: tuple, reason: A dead row is an old tuple version nobody can see anymore}
      - {id: mvcc, reason: Old versions are kept because other transactions may still need to see them}
      - {id: heap, reason: Dead rows sit in the heap pages of the table, strength: soft}

  - id: table-size
    name: Monitoring table size
    domain: Space
    level: 4
    description: Measuring where a table's space goes - heap, TOAST and indexes - how much of it is dead space, and how it changes over time.
    details: |
      `pg_relation_size` counts only the table's own pages. `pg_table_size` adds TOAST, and `pg_total_relation_size` adds indexes.
      A table that keeps growing while its row count does not is the usual sign of bloat.
    evidence:
      - Report the heap, TOAST and index size of one table
      - Find the ten tables that grew the most in a week
      - Explain why pg_relation_size is much smaller than pg_total_relation_size for a table with large values
    prerequisites:
      - {id: heap, reason: The heap is the part of the table you are measuring}
      - {id: toast, reason: Large values add a hidden table to the size, strength: soft}
      - {id: dead-rows, reason: Dead rows are a common reason a table is larger than its data, strength: soft}
      - {id: index, reason: Indexes can be as large as the table, strength: soft}

  - id: vacuum
    name: Vacuum
    domain: Space
    level: 3
    description: Finds dead rows and makes their space reusable. Autovacuum runs it in the background when enough rows have changed.
    details: |
      A plain `VACUUM` frees space for reuse inside the table but usually does not return it to the operating system.
      On big, busy tables the default autovacuum thresholds can be too lazy, and the settings can be tuned per table.
    evidence:
      - Say when autovacuum starts on a table (threshold plus scale factor times the row count)
      - Explain why VACUUM usually does not shrink the file on disk
      - Find tables where autovacuum is behind
    prerequisites:
      - {id: dead-rows, reason: Vacuum exists to reclaim dead rows}
      - {id: heap, reason: Vacuum works through the pages of the table, strength: soft}

  - id: vacuum-monitoring
    name: Monitoring vacuum
    domain: Space
    level: 4
    description: "Checking that vacuum keeps up: when it last ran, what it is doing now, what it removed, and what is holding it back."
    details: |
      The statistics views show dead rows and the last run per table, `pg_stat_progress_vacuum` shows a run in progress, and the autovacuum log shows what each run did.
      A table whose dead rows stay high after vacuum usually has an old transaction holding the cleanup back.
    evidence:
      - Find the tables with the most dead rows and the oldest last_autovacuum
      - Compute how many dead rows a table needs before autovacuum starts on it
      - Read the phase and progress of a running vacuum
      - Read an autovacuum log line and say whether dead rows were held back
      - Find the tables closest to transaction ID wraparound
    prerequisites:
      - {id: vacuum, reason: You need to know what vacuum and autovacuum do before you can watch them}
      - {id: dead-rows, reason: Dead rows are the main thing vacuum is measured by, strength: soft}
      - {id: table-size, reason: Table size shows whether vacuum is keeping bloat down, strength: soft}

  - id: visibility-map
    name: Visibility map
    domain: Space
    level: 3
    description: "A small companion file of every table that records, with two bits per page, whether all rows on the page are visible to everyone and whether they are all frozen. Vacuum sets the bits and any change to the page clears them."
    details: |
      It lets vacuum skip pages that have nothing to clean, and lets an index-only scan answer from the index without visiting the table.
      The map is conservative: a set bit is always true, but a clear bit may be wrong.
    evidence:
      - Explain why an index-only scan still visits the table sometimes
      - Show the size of the visibility map fork of a table
      - Say which operations set the bits and which clear them
      - Read Heap Fetches in an EXPLAIN ANALYZE plan and explain a high number
    prerequisites:
      - {id: vacuum, reason: Only vacuum sets the bits}
      - {id: heap, reason: The map describes the pages of the heap, strength: soft}
      - {id: mvcc, reason: Visibility to all transactions is an MVCC idea, strength: soft}
      - {id: index-scan, reason: Index-only scans are the main reader of the map, strength: soft}

  - id: buffer-settings
    name: Buffer pool settings
    domain: Memory & large values
    level: 4
    description: "The settings that size and drive the buffer pool and the writing of dirty pages, and the views that show how well the cache works."
    details: |
      `shared_buffers` sets the size of the pool and needs a restart. `effective_cache_size` is only a hint for the planner.
      The background writer and the checkpointer decide how fast dirty pages go to disk.
    evidence:
      - Say which setting sizes the pool and which one only informs the planner
      - Find the cache hit ratio of a database and of one table
      - Explain what a checkpoint costs and which settings control how often it happens
      - Name two things that look like buffer settings but are not, such as work_mem and temp_buffers
    prerequisites:
      - {id: buffer, reason: You need to know what the pool does before you size it}
      - {id: wal, reason: Checkpoints and WAL size drive how dirty pages are written, strength: soft}
      - {id: statistics, reason: The planner uses a cache size assumption when it estimates costs, strength: soft}

