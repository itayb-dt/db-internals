subject: Architecture
color: "#4dd0e1"
order: 6
description: "The parts of a PostgreSQL server and how they relate: the instance, its databases, files, write-ahead log and logs."
topics:
  - id: instance
    name: The instance
    domain: The server
    level: 0
    description: "One running PostgreSQL server: a main process, one backend process per connection, background workers, shared memory and a data directory that holds every database. The documentation calls it a database cluster."
    details: |
      "Cluster" here means one server instance and its data directory, not a group of servers.
      Memory, the WAL, the logs, roles and tablespaces are shared by every database in it.
    evidence:
      - Name the processes of a running instance and what each one does
      - Explain what a database cluster is, and why the word is misleading
      - Say what lives in the data directory
    prerequisites: []

  - id: databases
    name: Databases, schemas and roles
    domain: The server
    level: 1
    description: "An instance holds several databases. Each has its own catalogs, schemas and tables, and a connection works in one database at a time. Roles, tablespaces and the WAL are shared by all of them."
    details: |
      A query cannot reach into another database without an extension, but all databases share one write-ahead log.
      In SQL Server every database has its own transaction log. In MySQL a database and a schema are the same thing.
    evidence:
      - List what is separate per database and what is shared across the instance
      - Explain the difference between a database and a schema in PostgreSQL
      - Say why roles are not per database
    prerequisites:
      - {id: instance, reason: Databases live inside an instance}

  - id: files-tablespaces
    name: Files and tablespaces
    domain: On disk
    level: 2
    description: "How data sits on disk: the data directory, a set of files for every table and index, extra files for free space and row visibility, and tablespaces that place files on other storage."
    details: |
      Large relations are split into segment files.
      A tablespace is a directory somewhere else, which lets you put some tables or indexes on faster or larger storage.
    evidence:
      - Find the file that holds a given table
      - Say what a tablespace is and when you would create one
      - Explain why a table has more than one file
    prerequisites:
      - {id: instance, reason: The data directory belongs to the instance}
      - {id: databases, reason: Each database has its own directory of relation files}
      - {id: page, reason: Relation files are made of pages, strength: soft}

  - id: wal
    name: WAL and checkpoints
    domain: Durability
    level: 2
    description: "The write-ahead log. Every change is recorded in it before the data files, so the instance can recover after a crash. One WAL serves all databases, and replication and backup build on it. Its size normally stays near a limit, and grows when archiving fails, a replication slot holds it, or writes are heavy."
    details: |
      A checkpoint writes the changed pages from memory to the data files, so recovery only has to replay the log after the last checkpoint.
      If the disk that holds the log fills, PostgreSQL does a PANIC shutdown. No committed transaction is lost, but the instance stays offline until space is freed.
      SQL Server keeps a transaction log per database, and InnoDB has a redo log, which is the closest match.
    evidence:
      - Explain why a commit can return before the data files are written
      - Say what a checkpoint does and what it costs
      - Explain why heavy updates of large values increase WAL volume
      - Name the common reasons the WAL grows beyond its normal size and how to see each
      - Say why you should never delete WAL files by hand
    prerequisites:
      - {id: instance, reason: One WAL belongs to the whole instance}
      - {id: buffer, reason: Changes are made in the buffer pool first and the log protects them}

  - id: server-logs
    name: Server logs
    domain: Observability
    level: 4
    description: "What the instance writes to its log, where it goes, how it is rotated and what makes it big. The log holds the error log and, if you set a time threshold, the slow query log. Each has its own topic."
    details: |
      PostgreSQL has one server log. The error log and the slow query log are two uses of it.
      PostgreSQL does not remove old log files itself, so someone has to.
    evidence:
      - Find where the server log is written on your instance
      - Say who removes old log files on your instance
      - Name the settings that make the log grow
    prerequisites:
      - {id: instance, reason: The log is written by the instance}

  - id: load-balancer
    name: Load balancers and connection pooling
    domain: Connections
    level: 2
    description: "Software between the application and PostgreSQL. A pooler reuses a few server connections for many clients, and a load balancer routes traffic to the primary or spreads reads over replicas. Each PostgreSQL connection is a process, so connection count matters."
    details: |
      Poolers (PgBouncer, Odyssey, PgCat) and balancers (HAProxy, Pgpool-II) solve different problems, and some tools do both.
      Transaction pooling gives the best reuse but breaks session features such as SET and session advisory locks.
    evidence:
      - Explain why thousands of direct connections hurt PostgreSQL even when most are idle
      - Say the difference between a connection pooler and a load balancer
      - Choose between session and transaction pooling for a given application
      - Say why reads from a replica can return stale data
    prerequisites:
      - {id: instance, reason: Each connection is a backend process of the instance}
      - {id: buffer, reason: Shared memory is sized partly by the connection limit, strength: soft}

  - id: instance-disk-space
    name: "Low free disk space: the problem"
    domain: On disk
    level: 4
    description: "The disk of a PostgreSQL instance is almost full. How it is detected (the operating system or the cloud monitoring for the volume, the PostgreSQL system functions for the sizes of the databases and the write-ahead log), why it matters, and the first two checks: the largest database and what changed recently."
    details: |
      A full disk under the write-ahead log makes PostgreSQL shut down. No committed transaction is lost, but the instance stays offline until space is freed.
      If a database is the largest consumer, the problem track Large database takes over.
    evidence:
      - Name where each disk signal comes from, the operating system or cloud monitoring, or a PostgreSQL function
      - Name the first two checks when the disk of an instance fills
      - Say what happens when the disk that holds the write-ahead log fills
    prerequisites:
      - {id: instance, reason: The disk belongs to the instance and holds its parts}
      - {id: files-tablespaces, reason: "The data, the write-ahead log and the logs are different directories", strength: soft}

  - id: disk-space-causes
    name: Common root causes of low free disk space
    domain: On disk
    level: 4
    description: "A quick overview of why an instance runs out of disk space. The databases grew, the write-ahead log piled up, the logs grew, temporary files, something outside PostgreSQL, or capacity was never planned. Each cause has its own topic in the track."
    details: |
      The data directory is the largest part of most instances. The write-ahead log is the dangerous one.
    evidence:
      - List what lives on the disk of an instance besides the databases
      - Match a symptom, such as a large pg_wal, to the cause
    prerequisites:
      - {id: instance-disk-space, reason: The causes explain the problem described there}

  - id: disk-outside-postgres
    name: "Managed or self-managed: what else uses the disk"
    domain: On disk
    level: 4
    description: On a managed cloud service the provider runs the operating system, the volume and the backups, so what fills your storage is almost only PostgreSQL itself. On a system you run, a virtual machine or Kubernetes, the disk layout, the backups and other software can fill the disk regardless of the PostgreSQL instance.
    details: |
      A useful test is to add up what PostgreSQL reports (data, write-ahead log, logs) and compare it with what the volume reports as used. The gap is outside PostgreSQL.
    evidence:
      - Say which part of disk usage you can see and fix on a managed service, and which you own on a system you run
      - Name four things outside PostgreSQL that fill a volume
      - Describe how to find disk use that PostgreSQL does not know about
    prerequisites:
      - {id: disk-space-causes, reason: This is one of the causes in the overview}

  - id: error-log
    name: The error log
    domain: Observability
    level: 4
    description: "The part of the server log where the instance reports about itself. Errors and warnings, startup and shutdown, checkpoints and long autovacuum runs. What is written depends on the minimum severity you set."
    details: |
      A failing statement is logged with its text, so the error log can hold sensitive values.
      A repeating error, such as an application retrying in a loop, is the common way for this log to grow.
    evidence:
      - Name the severity levels and which ones the default setting writes
      - Find the cause of a failed archive command or a refused connection in the log
      - Say why a repeating error makes the log grow
    prerequisites:
      - {id: server-logs, reason: The error log is one use of the server log}
      - {id: wal, reason: Archiving failures and checkpoints are reported here, strength: soft}

  - id: slow-query-log
    name: The slow query log
    domain: Observability
    level: 4
    description: "The statements that ran longer than a threshold, written to the server log with their duration and text. It shows single executions with their real values, so it can hold personal data."
    details: |
      PostgreSQL has no separate slow query log. A threshold in milliseconds decides which statements are written, and sampling can log only a fraction of the borderline ones.
      Query metrics show totals. The slow query log shows the one slow run.
    evidence:
      - Say what an entry in the slow query log contains
      - Choose a threshold and say what happens if it is too low
      - Explain how sampling reduces the volume
      - Say why the log can contain personal data and what to do about it
    prerequisites:
      - {id: server-logs, reason: The slow query log is one use of the server log}
      - {id: query-metrics, reason: The log shows single runs that the metrics hide, strength: soft}
