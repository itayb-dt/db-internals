order: 4
kind: problem
name: Slow query
title: Find why a query is slow, read its plan and choose the fix
problem: A query takes much longer than it should.
steps:
  - topic: analyzing-slow-queries
    phase: problem
    why: The problem. What slow means, and the loop of find, understand, name the cause, fix and measure.
  - topic: query-metrics
    phase: problem
    why: How it is detected. The main numbers, and how to find the query that costs the most.
  - topic: slow-query-causes
    phase: causes
    why: The potential root causes of a slow query, with a quick overview of each.
  - topic: execution-plan
    phase: cause
    why: See what the database planned to do, and spot scans of too many rows.
  - topic: actual-plan
    phase: cause
    why: See what really happened, and where the estimate was wrong.
  - topic: index
    phase: cause
    why: A missing or unused index. How an index replaces a scan with a lookup, and what it costs.
  - topic: partitioning
    phase: cause
    why: A table that is simply huge. How skipping partitions cuts the data a query reads.
