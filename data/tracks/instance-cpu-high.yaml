order: 7
name: The DB Instance CPU is high
title: Find why the CPU of a PostgreSQL instance is high, and what to do about it
problem: The CPU of the database host is far above its usual level. Queries slow down for everyone, and at 100 percent the instance cannot keep up and requests start to time out.
steps:
  - topic: query-metrics
    phase: now
    why: What is happening now. Which statements cost the most time, and so the most CPU.
  - topic: high-cpu-causes
    phase: why
    why: Why it happened. Why a high CPU matters, then the common root causes, each with a check and a fix.
  - topic: execution-plan
    phase: why
    why: When one statement is the cause. Read its plan and look for scans of too many rows.
  - topic: index
    phase: fix
    why: The most common fix for costly statements. Turn a scan into a lookup.
  - topic: load-balancer
    phase: fix
    why: The fix for too many sessions and connection storms. A pooler keeps the active ones near the cores.
