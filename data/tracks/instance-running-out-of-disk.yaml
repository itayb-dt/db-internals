order: 6
kind: problem
name: Low free disk space
title: Find what fills the disk of a PostgreSQL instance, and when to hand over to the database track
problem: The disk of the instance is almost full. When the disk under the write-ahead log fills, PostgreSQL shuts down, so the time you have is short.
steps:
  - topic: instance-disk-space
    phase: problem
    why: The problem. How it is detected, why it matters, and the first two checks.
  - topic: disk-space-causes
    phase: causes
    why: The potential root causes, with a quick overview of each.
  - topic: wal
    phase: cause
    why: The write-ahead log. Why pg_wal grows and what makes the server stop.
  - topic: server-logs
    phase: cause
    why: What the instance writes to its log, where it goes and who removes old files.
  - topic: error-log
    phase: cause
    why: The error log. What it holds, and how a repeating error fills the disk.
  - topic: slow-query-log
    phase: cause
    why: The slow query log. Thresholds, sampling and the risk of personal data.
  - topic: disk-outside-postgres
    phase: cause
    why: Managed or self-managed. What else can fill the disk when you run the system yourself.
  - topic: database-growth-causes
    phase: cause
    why: The hand-over. If a database is the largest consumer, the Large database track takes over here.
